<script>
const t0 = caption(ROOT, 'Every screen carries a safety net', { top: 80, size: 68, bare: true });
wordsIn(tl, t0, at(0));
['#sf-tv', '#sf-edge', '#sf-do'].forEach((s, i) => show(tl, $(s), at(0) + 0.3 + i * 0.2, 0.6, { y: 30 }));

show(tl, poll, at(1) + 1.6, 0.5, { y: 16 });
out(tl, poll, at(1) + 4.4);
const B = $('#sf-bars');
[1, 2, 4, 8, 16, 32, 60].forEach((s, i) => {
  const r = HT('div', { class: 'bar' }, B);
  const b = HT('b', { css: `width:${60 + Math.log2(s) * 160}px` }, r);
  HT('span', { text: s < 60 ? `${s} s` : '60 s max' }, r);
  tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.2 }, at(1) + 4.8 + i * 0.55);

show(tl, safe, at(2) + 0.3, 0.5, { y: 16 });
out(tl, safe, at(3) - 0.2);
// keep-alive answered at the edge
show(tl, $('#sf-zz'), at(3) + 0.4, 0.5);
for (let k = 0; k < 2; k++) {
  const t = at(3) + 1.0 + k * 1.2;

gsap.set(['#sf-ping', '#sf-pong'], { opacity: 0 });

wordsIn(tl, c3, at(3) + 3.6);
