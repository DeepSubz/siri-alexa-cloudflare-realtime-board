<style>
#root { background: linear-gradient(#f1dfca 0 68%, #b8875a 68% 100%); }
.tiles { position: absolute; left: 0; right: 0; top: 0; height: 68%; opacity: .5;
  background: repeating-linear-gradient(0deg, transparent 0 118px, rgba(150,120,90,.25) 118px 120px), repeating-linear-gradient(90deg, transparent 0 238px, rgba(150,120,90,.25) 238px 240px); }
.edge { position: absolute; left: 0; right: 0; top: 68%; height: 18px; background: #d6a877; }
.bub { position: absolute; max-width: 820px; padding: 30px 40px; border-radius: 40px; font: 700 54px/1.15 Outfit, sans-serif; box-shadow: 0 24px 48px rgba(60,40,20,.2); }
.bub small { display: block; font: 600 28px Inter, sans-serif; letter-spacing: .05em; margin-bottom: 10px; opacity: .7; }
.me { background: #fff; color: #18202c; border-bottom-left-radius: 10px; }
.as { background: #18202c; color: #fff; border-bottom-left-radius: 10px; }
.hint { position: absolute; left: 960px; top: 90px; font: 800 72px Outfit, sans-serif; color: #18202c; letter-spacing: -.02em; }
</style>
<body>
  <div class="tiles"></div><div class="edge"></div>
  <div id="si-phone"></div>
  <div class="bub me" id="si-b1" style="left:880px;top:300px"><small>YOU</small>“Hey Siri, Family Board.”</div>
  <div class="bub as" id="si-b2" style="left:880px;top:500px"><small>SIRI</small>What should I update?</div>
  <div class="bub me" id="si-b3" style="left:880px;top:700px"><small>YOU</small>“Add dentist Thursday at four.”</div>
</body>
<script>
const P = iphone($('#si-phone'), 300, 110, 0.96);
const hint = caption(ROOT, 'Follow one sentence', { top: 90, x: 880, size: 72, bare: true });
wordsIn(tl, hint, at(0));
out(tl, hint, at(1) - 0.5);
show(tl, $('#si-b1'), at(1) - 0.3, 0.6, { x: -40 });
tl.fromTo(P.dim, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(1));
tl.fromTo(P.edge, { opacity: 0 }, { opacity: 1, duration: 0.5 }, at(1));

typeOn(tl, P.ask, 'What should I update?', at(2), 0.7);
show(tl, $('#si-b2'), at(2), 0.6, { x: -40 });
show(tl, $('#si-b3'), at(3), 0.6, { x: -40 });
typeOn(tl, P.said, 'Add dentist Thursday at four', at(3) + 0.1, CUE[3].d);
// zoom into the phone as the request leaves
tl.fromTo(P.el, { scale: 0.96 }, { scale: 1.25, duration: 1.0, ease: 'power3.in', immediateRender: false }, end(3) + 0.3);
['#si-b1', '#si-b2', '#si-b3'].forEach(s => out(tl, $(s), end(3) + 0.3, 0.4));
</script>
