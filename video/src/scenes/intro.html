<style>

<body>
  <div id="in-world"></div>
  <div class="title" id="in-title"><h1>System architecture</h1><p>a live demonstration across four ecosystems</p></div>

  <div class="eco" id="in-apple" style="--c:#2f6ff2;left:110px;top:120px"><b><i></i>Apple</b><span>Siri · Shortcuts</span></div>
  <div class="eco" id="in-amazon" style="--c:#0f9a92;left:110px;top:435px"><b><i></i>Amazon</b><span>Alexa · signed skill</span></div>
  <div class="eco" id="in-muse" style="--c:#7350e6;left:110px;top:750px"><b><i></i>Meta</b><span>Muse · AI assistant</span></div>
  <div class="eco hub" id="in-cf" style="--c:#f2903c;left:760px;top:390px"><b><i></i>Cloudflare edge</b><span>Workers · Workers AI<br>Durable Objects</span></div>

<script>
// title
const title = $('#in-title');
// the title is on screen from frame 0 (the thumbnail)
tl.fromTo(title.querySelector('p'), { opacity: 0 }, { opacity: 1, duration: 0.5 }, at(0) + 1.2);
out(tl, title, at(1) - 0.2, 0.4);
// four ecosystems, walled off from each other
const ecos = [['#in-apple', at(1) + 2.2], ['#in-amazon', at(1) + 3.4], ['#in-muse', at(1) + 4.6], ['#in-cf', at(1) + 6.0]];
ecos.forEach(([s, t]) => show(tl, $(s), t, 0.7, { y: 30 }));
// the event crosses them
const svg = $('#in-lines');
const curve = (x1, y1, x2, y2) => `M${x1} ${y1} C ${x1 + 160} ${y1}, ${x2 - 160} ${y2}, ${x2} ${y2}`;
const paths = [curve(580, 225, 760, 500), curve(580, 540, 760, 540), curve(580, 855, 760, 580), curve(1280, 540, 1490, 575)];
const cols = ['#2f6ff2', '#0f9a92', '#7350e6', '#e0662a'];
const P = paths.map((d, i) => SV('path', { d, fill: 'none', stroke: cols[i], 'stroke-width': 6, 'stroke-linecap': 'round' }, svg));
P.forEach((p, i) => drawPath(tl, p, at(2) + 0.1 + i * 0.15, 0.9));
packet(tl, P[0], at(2) + 1.0, 1.1, { r: 16, color: '#2f6ff2', sw: 5, parent: svg });
packet(tl, P[1], at(2) + 1.5, 1.1, { r: 16, color: '#0f9a92', sw: 5, parent: svg });
packet(tl, P[2], at(2) + 2.0, 1.1, { r: 16, color: '#7350e6', sw: 5, parent: svg });
packet(tl, P[3], at(2) + 3.0, 1.0, { r: 18, color: '#e0662a', sw: 5, parent: svg });
const rt = tag(ROOT, 'near real time', COL.write, [1020, 330], { size: 40 });
show(tl, rt, at(2) + 1.2, 0.5, { y: 16 });
show(tl, $('#in-landed'), end(2) - 0.8, 0.6, { rotation: -8, scale: 0.7 });
// the project is the surface; the architecture is underneath
const fade = [...ecos.map(e => $(e[0])), svg, rt, $('#in-landed')];
fade.forEach(el => out(tl, el, at(3) - 0.3, 0.4));
const sf = $('#in-surface');
board(sf, 960, 540);
show(tl, sf, at(3) + 0.1, 0.8, { scale: 0.9 });
const l1 = tag(ROOT, 'the project: a family board', COL.write, [960, 180], { size: 40 });
show(tl, l1, at(3) + 0.4, 0.5, { y: 16 });
const W = isoWorld($('#in-world'), { prefix: 'in' });
W.setCam(tl, 'all', 0.97, 0, 40);
gsap.set($('#in-world'), { opacity: 0 });
tl.fromTo($('#in-world'), { opacity: 0 }, { opacity: 1, duration: 0.6 }, at(3) + 3.0);
tl.fromTo(sf, { y: 0 }, { y: -900, duration: 0.9, ease: 'power3.in', immediateRender: false }, at(3) + 3.0);
out(tl, l1, at(3) + 2.9, 0.3);
const l2 = tag(ROOT, 'the subject: the architecture underneath', COL.ink, [960, 140], { size: 44 });
show(tl, l2, at(3) + 3.8, 0.6, { y: 16 });
</script>
