  /* Same settings as the main board. URL extras: ?perf=1 shows a frame counter,
     ?breeze=1 keeps every note gently moving all the time (to compare the cost). */
  window.BOARD_CONFIG = {
    src: 'api/tasks', pollMs: 2000, headers: {}, credentials: 'same-origin',

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d6; }
  canvas#gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #status, #perf {
    position: fixed; bottom: 10px; z-index: 5; pointer-events: none;
    font: 12px/1.3 -apple-system, system-ui, sans-serif; color: #8a857b;
  }
  #status { right: 14px; opacity: 0; transition: opacity .4s; }
  #status.show { opacity: .9; }
  #perf { left: 14px; background: rgba(255,255,255,.6); padding: 3px 7px; border-radius: 6px; display: none; }

<body>

<div id="sr" class="sr" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';

const CONFIG = Object.assign({ src: 'api/tasks', fallbackSrc: 'tasks.md', pollMs: 2000, headers: {}, credentials: 'same-origin', doneHours: 3, boardTitle: 'The Family Board' }, window.BOARD_CONFIG || {});
const qs = new URLSearchParams(location.search);
if (qs.get('src'))  CONFIG.src = qs.get('src');
if (qs.get('poll')) CONFIG.pollMs = Math.max(1000, +qs.get('poll') * 1000);
if (qs.get('doneHours') != null && !isNaN(+qs.get('doneHours'))) CONFIG.doneHours = Math.max(0, +qs.get('doneHours'));
const BREEZE = qs.get('breeze') === '1';
const PERF = qs.get('perf') === '1';
// TV mode: on automatically on a Fire TV (its browser reports an "AFT…" device), or force it with ?tv=1 / ?tv=0.
// Keeps the screen awake and renders lighter for a TV stick's graphics chip.
const TV = qs.get('tv') === '1' || (qs.get('tv') !== '0' && /\bAFT[A-Z0-9]*\b/.test(navigator.userAgent));

// ---------- the board's clock — preview another moment with ?date=2026-12-24&time=21:30 ----------
const CLOCK_OFFSET = (() => {
  const d = qs.get('date'), t = qs.get('time');
  if (!d && !t) return 0;
  const now = new Date(), target = new Date(now);
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) { const [y, m, dd] = d.split('-').map(Number); target.setFullYear(y, m - 1, dd); }
  if (t && /^\d{1,2}:\d{2}$/.test(t)) { const [h, mi] = t.split(':').map(Number); target.setHours(h, mi, 0, 0); }
  return target - now;
})();
const nowDate = () => new Date(Date.now() + CLOCK_OFFSET);
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const DAY_MS = 86400000;

// ---------- reading the dates in a task ----------
// Understands "Fri Dec 4", "12 Dec", "Dec 31 to Jan 2", "due Dec 9", "from Mon Nov 30",
// "today", "tomorrow" and plain weekdays ("Wed 6pm", "Tue-Wed").
const MONTH_IX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const MONTHS = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
const WEEKDAY_IX = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const WEEKDAYS = /\b(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)\b/g;
const DATE_RE = new RegExp(`\\b(${MONTHS})\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b|\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(${MONTHS})\\b`, 'g');
function taskWhen(text, today) {
  const t = text.toLowerCase(), found = [];
  let m;
  DATE_RE.lastIndex = 0;
  while ((m = DATE_RE.exec(t))) {
    const mon = MONTH_IX[(m[1] || m[4]).slice(0, 3)], day = +(m[2] || m[3]);
    if (day < 1 || day > 31) continue;
    let best = null;                                   // the year that puts it nearest to today
    for (const y of [today.getFullYear() - 1, today.getFullYear(), today.getFullYear() + 1]) {
      const d = new Date(y, mon, day);
      if (!best || Math.abs(d - today) < Math.abs(best - today)) best = d;
    }
    found.push({ d: best, i: m.index, end: m.index + m[0].length });
  }
  const w = { dates: [], range: null, from: /\b(from|starting|since)\b/.test(t), days: [] };
  if (found.length >= 2 && /\bto\b|–|—|-|\buntil\b|\bthru\b|\bthrough\b/.test(t.slice(found[0].end, found[1].i))) {
    let a = found[0].d, b = found[1].d;
    if (b < a) b = new Date(b.getFullYear() + 1, b.getMonth(), b.getDate());
    w.range = [a, b];
  } else w.dates = found.map(f => f.d);
  if (/\b(today|tonight)\b/.test(t)) w.dates.push(today);
  if (/\btomorrow\b/.test(t)) w.dates.push(addDays(today, 1));
  if (!found.length) { WEEKDAYS.lastIndex = 0; while ((m = WEEKDAYS.exec(t))) w.days.push(WEEKDAY_IX[m[1].slice(0, 3)]); }
  return w;
}
// Something to DO has a deadline (overdue when missed); anything else with a past date is just an event that happened.
const ACTION_WORDS_RE = /\b(due|deadline|submit|turn in|hand in|return|sign|send|buy|order|book (?:a|an|the|tickets?|flights?|hotel|appointment)|call|pay|renew|register|rsvp|schedule|fill|finish|complete|bring|pick up|drop off|reply|email|list|form|apply)\b/;
// 'today' | 'tomorrow' | 'overdue' | 'past' | null — only for open tasks
function taskStatus(item, now = nowDate()) {
  if (!item.task || item.done) return null;
  const today = dayStart(now), tomorrow = addDays(today, 1);
  const same = (a, b) => a.getTime() === b.getTime();
  const w = taskWhen(item.text, today);
  if (w.range) {
    if (today >= w.range[0] && today <= w.range[1]) return 'today';
    if (same(w.range[0], tomorrow)) return 'tomorrow';
    return today > w.range[1] ? (ACTION_WORDS_RE.test(item.text.toLowerCase()) ? 'overdue' : 'past') : null;
  }
  if (w.dates.length) {
    if (w.dates.some(d => same(d, today))) return 'today';
    if (w.dates.some(d => same(d, tomorrow))) return 'tomorrow';
    if (!w.from && w.dates.every(d => d < today)) return ACTION_WORDS_RE.test(item.text.toLowerCase()) ? 'overdue' : 'past';
    return null;
  }
  if (w.days.length) {                                 // weekday only: this week's
    if (w.days.includes(today.getDay())) return 'today';
    if (w.days.includes(tomorrow.getDay())) return 'tomorrow';
  }
  return null;
}

// ---------- seasons and holidays ----------
function seasonAt(d) {
  const m = d.getMonth(), day = d.getDate(), y = d.getFullYear(), today = dayStart(d);
  const nov1 = new Date(y, 10, 1).getDay(), thanksgiving = new Date(y, 10, 1 + ((4 - nov1 + 7) % 7) + 21);   // 4th Thursday of November
  let holiday = null;
  if ((m === 11 && day >= 18) || (m === 0 && day <= 1)) holiday = 'christmas';
  else if (m === 1 && day >= 7 && day <= 14) holiday = 'valentine';
  else if (m === 9) holiday = 'halloween';
  else if (today >= addDays(thanksgiving, -6) && today <= addDays(thanksgiving, 1)) holiday = 'thanksgiving';
  const season = (m === 11 || m <= 1) ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
  return { season, holiday };
}

// ---------- markdown → groups (identical rules to the main board) ----------
const clean = (s) => s
  .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
  .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
  .replace(/(\*\*|__)(.+?)\1/g, '$2')
  .replace(/(^|\s)\*(\S(?:.*?\S)?)\*(?=\s|$)/g, '$1$2')
  .replace(/`([^`]*)`/g, '$1')
  .replace(/<[^>]+>/g, '')
  .trim();
// ---------- markdown -> groups -> notes ----------
function parse(md) {
  const lines = md.replace(/\r/g, '').replace(/<!--[\s\S]*?-->/g, '').split('\n');
  const hasSubheads = lines.some(l => /^#{2,6}\s/.test(l));
  const groups = []; let cur = null;
  const open = (title) => { cur = { title: title || 'To do', items: [] }; groups.push(cur); };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) continue;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
      if (m[1].length === 1 && hasSubheads) continue;   // top-level "# Board title"
      open(clean(m[2])); continue;
    }
    if ((m = l.match(/^\s*(?:[-*+]|\d+[.)])\s+(?:\[([ xX])\]\s*)?(.*)$/))) {
      if (!cur) open('To do');
      let text = m[2].trim();
      let done = m[1] ? m[1].toLowerCase() === 'x' : false;
      const whole = text.match(/^~~(.*)~~$/); if (whole) { done = true; text = whole[1]; }
      text = clean(text);
      if (text) cur.items.push({ text, done, task: true });
      continue;
    }
    const t = l.trim();
    if (cur && !/^(-{3,}|\*{3,}|_{3,}|>|```|\|)/.test(t)) {
      const text = clean(t);
      if (text) cur.items.push({ text, done: false, task: false });
    }
  }
  return groups.filter(g => g.items.length);
}

// ---------- a bendable sheet (notes and the banner) ----------
// A plane hinged along its top edge; rows further down bend more, like real paper curling off a pin.
function makeSheet(cols, rows) {
  const geo = new THREE.PlaneGeometry(1, 1, cols, rows).translate(0, -0.5, 0);
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3).fill(1), 3));
  return { geo, base: geo.attributes.position.array.slice(), rows, cols };
}
// bendDeg: angle at the bottom edge; corner: extra lift of one bottom corner (-1 left … 1 right)
function bendSheet(sh, bendDeg, corner, glue = 0.2) {
  const { geo, base, rows } = sh;
  const pos = geo.attributes.position.array, col = geo.attributes.color.array;
  const ys = new Float32Array(rows + 1), zs = new Float32Array(rows + 1), th = new Float32Array(rows + 1);
  const ds = 1 / rows;
  for (let r = 1; r <= rows; r++) {
    const t = r / rows, w = t <= glue ? 0 : Math.pow((t - glue) / (1 - glue), 1.5);
    th[r] = bendDeg * DEG * w;
    ys[r] = ys[r - 1] - ds * Math.cos(th[r]);
    zs[r] = zs[r - 1] + ds * Math.sin(th[r]);
  }
  for (let i = 0; i < pos.length; i += 3) {
    const x = base[i], r = Math.round(-base[i + 1] * rows), t = r / rows;
    const lift = corner * Math.pow(clamp(x * Math.sign(corner) + .5, 0, 1), 2) * Math.pow(Math.max(0, t - glue), 2) * 0.09;
    pos[i] = x; pos[i + 1] = ys[r]; pos[i + 2] = zs[r] + Math.abs(lift);
    // paper turned away from the window light reads darker
    const shade = 1 - 0.32 * Math.sin(th[r]) - Math.abs(lift) * 1.2;
    col[i] = col[i + 1] = col[i + 2] = clamp(shade, .55, 1);
  }
  geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  geo.computeBoundingSphere();
}

const writingSize = (S, font) => S * 0.077 * font.s;

// Word-wrap; a line may run a little into the margin rather than leave one short word on its own.
function wrap(ctx, text, maxW, slack = 0) {
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  // pull a lone short last word (like "4" or "17") back up if it fits within the slack
  if (lines.length > 1 && lines[lines.length - 1].length <= 6) {
    const joined = lines[lines.length - 2] + ' ' + lines[lines.length - 1];
    if (ctx.measureText(joined).width <= maxW + slack) { lines.splice(-2, 2, joined); }
  }
  return lines;
}

  if (parts > 1) ops.push({ k: 'small', x: padL + tw + ts * .3, y: y + ts * .85, size: ts * .58, text: `(${n.part + 1} of ${parts})` });
  else ops.push({ k: 'ticon', x: padL + tw + ts * .3, y: y + ts * .85 - ts * 1.25, size: ts * 1.45, icon: groupIcon(n.group) });

let boardGids = new Set();
function toNotes(groups, S) {
  const notes = [], seen = {};
  boardGids = new Set();
  for (const g of groups) {
    const gkey = g.title.toLowerCase();
    seen[gkey] = (seen[gkey] || 0) + 1;
    const gid = seen[gkey] > 1 ? `${gkey}~${seen[gkey]}` : gkey;
    const { font } = look({ gid });
    boardGids.add(gid);
    const base = { gid, group: g.title };
    let chunks;
    if (fitsOnNote({ ...base, part: 0, items: g.items }, font, S, 1)) chunks = [g.items];

    let res = await fetch(CONFIG.src, opts);
    if (res.status === 404 && CONFIG.fallbackSrc && CONFIG.src === 'api/tasks') res = await fetch(CONFIG.fallbackSrc, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    received(await res.text());
  } catch (e) {
    if (!liveUp) setStatus(`Can't reach the task list (${e.message || 'network error'}) — retrying…`);
  } finally {
    setTimeout(poll, liveUp ? 60000 : (document.hidden ? Math.max(CONFIG.pollMs, 15000) : CONFIG.pollMs));
  }
}
function received(text) { setStatus(''); if (text !== lastText) { lastText = text; update(text); } }
function connectLive() {
  if (!('WebSocket' in window) || CONFIG.src !== 'api/tasks' || !/^https?:$/.test(location.protocol)) return;
  let ws, ping;
  try { ws = new WebSocket(new URL('api/live', location.href).href.replace(/^http/, 'ws')); } catch (e) { return; }
  ws.onopen = () => { liveUp = true; liveRetry = 1000; ping = setInterval(() => { try { ws.send('ping'); } catch (e) {} }, 30000); };
  ws.onmessage = (e) => { if (e.data !== 'pong') received(String(e.data)); };
  ws.onclose = () => { clearInterval(ping); liveUp = false; setTimeout(connectLive, liveRetry); liveRetry = Math.min(liveRetry * 2, 60000); };
}

// ---------- TV mode: keep the screen awake ----------
function keepAwake() {
  // 1) ask the browser to keep the screen on (re-asked whenever the page comes back into view)
  const ask = () => { if ('wakeLock' in navigator && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {}); };
  // 2) backup: a tiny silent black video on loop — Fire TV won't start its screensaver or sleep while video plays
  const v = document.createElement('video');
  v.src = 'assets/keepawake.mp4'; v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('aria-hidden', 'true');
  v.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1';
  document.body.appendChild(v);
  const play = () => { if (document.visibilityState === 'visible') v.play().catch(() => {}); };
  ask(); play();
  document.addEventListener('visibilitychange', () => { ask(); play(); });
  // if autoplay was blocked, the first remote/key press starts it
  for (const ev of ['keydown', 'pointerdown', 'touchstart']) addEventListener(ev, () => { ask(); play(); }, { once: true });
}
if (TV) { keepAwake(); document.body.style.cursor = 'none'; }

// ---------- start ----------
let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { sizeScene(); buildWall(); drawBanner(); buildPlants(); if (lastText != null) update(lastText, true); kick(); }, 150);
});
sizeScene(); buildWall(); updateTint(); kick();
setInterval(updateTint, 5 * 60 * 1000);
scheduleMidnight();
loadSheets().then(() => buildPlants(), (e) => { console.warn('plant images unavailable, using drawn plants', e); buildPlants = buildPlantsSVG; buildPlants(); });
const fontLoads = ["24px 'Kaushan Script'", ...FONTS.map(f => `${f.w} 24px ${f.f.split(',')[0]}`)].map(s => document.fonts.load(s).catch(() => {}));
Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 3000))]).then(() => {
  drawBanner(); kick();
  poll(); connectLive();
  if (!reduceMotion) { setTimeout(gust, 4000); natureTimers(); }
});
</script>
